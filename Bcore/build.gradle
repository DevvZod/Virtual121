plugins {
    id 'com.android.library'
}

android {
    namespace 'top.niunaijun.blackbox'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('./src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    buildFeatures {
        aidl true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation "com.github.CodingGay.BlackReflection:core:$rootProject.ext.blackReflection"
    implementation project(':Bcore:black-fake')
    implementation project(':Bcore:black-hook')
    implementation project(':android-mirror')

    implementation project(':Bcore:pine-core')
    implementation project(':Bcore:pine-xposed')
    implementation project(':Bcore:pine-xposed-res')
}



// -- HORCRUX build fix ---------------------------------------------
// build-tools 33+ aidl.exe embeds the full command line in the generated
// file header. On Windows, project paths containing `\user\` become
// illegal unicode escapes (\u + non-hex) for javac � even inside
// comments (JLS processes \u escapes before lexing). Strip the comment
// after AIDL generation, before Java compilation.
def stripAidlHeaders = tasks.register('stripAidlHeaders') {
    def genDir = layout.buildDirectory.dir('generated/aidl_source_output_dir')
    doLast {
        def outDir = genDir.get().asFile
        if (!outDir.exists()) return
        outDir.eachFileRecurse { f ->
            if (f.name.endsWith('.java')) {
                def text = f.getText('UTF-8')
                def stripped = text.replaceAll('(?m)^\\s*\\* Using:.*\\r?\\n', '')
                if (stripped != text) f.setText(stripped, 'UTF-8')
            }
        }
    }
}
tasks.matching { it.name.endsWith('Aidl') }.configureEach {
    finalizedBy stripAidlHeaders
}
tasks.matching { it.name.contains('JavaWithJavac') }.configureEach {
    mustRunAfter stripAidlHeaders
    dependsOn stripAidlHeaders
}

